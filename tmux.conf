set-window-option -g mode-keys vi

# dwm-session maps Caps Lock to F2 so the prefix also works through SSH.
# Keep Ctrl-b available on keyboards without that mapping.
set-option -g prefix F2
set-option -g prefix2 C-b
bind-key F2 send-prefix
bind-key C-b send-prefix -2

# Navigate panes with the same directions as Vim.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Repeat resizing without immediately pressing the prefix again.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Open splits in the current pane's directory.
bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key '-' split-window -v -c '#{pane_current_path}'

# l is used for navigation above; Tab switches to the previous tmux window.
bind-key Tab last-window

# Let Codex and other applications detect when the terminal loses focus.
set-option -as terminal-features ',st*:focus'
set-option -g focus-events on

# Forward bells from every tmux window to st, which marks the dwm tag urgent.
set-window-option -g monitor-bell on
set-option -g bell-action any
set-option -g visual-bell off

# bind-key -t vi-copy 'v' begin-selection
# bind-key -t vi-copy 'y' copy-selection
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-selection

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key M split-window -h "vim ~/.tmux.conf"

